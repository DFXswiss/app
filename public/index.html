    <style>
      .loader-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .loader {
        color: #072440;
      }

      /* Outage notice: in normal document flow above the app, never covering its controls.
         The app stylesheet (src/index.css) makes every body > div a full-height flex column; the
         notice opts out of that (display: block, height: auto, flex: none) so it is only as tall as
         its text. While the notice is shown, outage-notice.js adds has-outage-notice to body, which
         makes body a flex column so #root takes exactly the remaining height below the notice.
         Dark text on amber, contrast about 11:1 (WCAG AA). Shown by outage-notice.js. */
      .outage-notice {
        display: block;
        height: auto;
        flex: none;
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 12px 16px;
        background-color: #ffcc00;
        color: #1b1b1b;
        border-bottom: 2px solid #1b1b1b;
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.4;
        text-align: center;
        overflow-wrap: break-word;
      }

      .outage-notice[hidden] {
        display: none;
      }

      .outage-notice p {
        margin: 0;
      }

      .outage-notice p + p {
        margin-top: 4px;
      }

      body.has-outage-notice {
        display: flex;
        flex-direction: column;
      }

      body.has-outage-notice > #root {
        height: auto;
        flex: 1 1 auto;
        min-height: 0;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="outage-notice" class="outage-notice" aria-live="polite" hidden>
      <p lang="de">Systemunterbruch bei DFX bis heute, 18. November 2026, 12:00 Uhr MEZ.</p>
      <p lang="en">System outage at DFX until today, 18 November 2026, 12:00 CET.</p>
    </div>
    <script src="%REACT_APP_PUBLIC_URL%/outage-notice.js"></script>
    <div id="root">
      <div class="loader-container">
        <div class="loader">Loading ...</div>
      </div>
    </div>
  </body>
</html>
