server {
    listen 80;
    server_name _;
    default_type application/json;

    location = /lnurlp/e2e {
        alias /usr/share/nginx/html/pay-request.json;
    }

    # Source: https://github.com/lightning/bolts/blob/master/11-payment-encoding.md
    # This BOLT-11 test vector does not originate from DFX and cannot be paid.
    location = /cb {
        # The spec sells 0.0025 BTC: 0.0025 * 100,000,000 sat/BTC * 1,000 msat/sat
        # = 250,000,000 msat, which LNURL-pay carries in the callback's amount query parameter.
        if ($arg_amount != "250000000") {
            return 400 '{"status":"ERROR","reason":"expected amount=250000000 msat"}';
        }
        alias /usr/share/nginx/html/invoice.json;
    }

    location / {
        return 404;
    }
}
