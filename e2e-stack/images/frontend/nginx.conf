server {
    listen 80;
    server_name _;
    # Keep callback redirects on the externally mapped port of the local stack.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # App 2.0 is hash-routed. Checkout.com and e-mail callbacks hit real paths under
    # /app2/.... Mirror public/_redirects and src/setupProxy.js: 302 into the hash
    # under /app2/ (query is preserved).
    location = /app2/buy/success {
        return 302 /app2/#/buy/success$is_args$args;
    }
    location = /app2/buy/success/ {
        return 302 /app2/#/buy/success$is_args$args;
    }
    location = /app2/buy/failure {
        return 302 /app2/#/buy/failure$is_args$args;
    }
    location = /app2/buy/failure/ {
        return 302 /app2/#/buy/failure$is_args$args;
    }
    location = /app2/account-merge {
        return 302 /app2/#/account-merge$is_args$args;
    }
    location = /app2/account-merge/ {
        return 302 /app2/#/account-merge$is_args$args;
    }

    location /app2/ {
        try_files $uri $uri/ /app2/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
